<!DOCTYPE html>
<html>
<head>
	<title>Ride Location Tracker</title>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width", initial-scale=1.0"/>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
		crossorigin=""/>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
		crossorigin="">
	</script>
	<style>
		body { margin: 0; padding: 0; }
		#map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
	<div id="map"></div>
	<script>
    let markers = {};
    //init map layer
    var map = L.map('map').setView([51.505, -0.09], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    function fetchNearbyDrivers() {
        const center = map.getCenter();
        const radius = map.getBounds().getNorthEast().distanceTo(map.getCenter()) / 1000;
		console.log(`${center} :${radius}`);

        const get_nearby_drivers_url = `http://localhost:8080/api/drivers/nearby?lat=${center.lat}&lon=${center.lng}&radius=${radius}`;

        fetch(get_nearby_drivers_url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(driversMsg => {
				console.log(`Drivers ${driversMsg}`)
                
                Object.values(markers).forEach(marker => marker.remove());
                markers = {};

                driversMsg.messages.forEach(driver => {
					console.log(`${driver} found`);
                    const marker = L.marker([driver.latitude, driver.longitude]).addTo(map);
                    marker.bindPopup(`Driver ID: ${driver.driverId}`);
                    markers[driver.driverId] = marker;
                });
            })
            .catch(error => console.error('Error fetching nearby drivers:', error));
    }

    fetchNearbyDrivers();
    setInterval(fetchNearbyDrivers, 5000);
    map.on('moveend', fetchNearbyDrivers);
</script>
</body>
</html>
